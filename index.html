<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>あやとり てほん — 写真でおぼえる糸あそび</title>
<meta name="description" content="写真とことばで、あやとりの手順をひとつずつおぼえられるてほんアプリ。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FCFAF3;
    --paper-2:#F6F1E4;
    --ink:#28241F;
    --muted:#847A6B;
    --line:#E7DFCE;
    --ai:#2F5D8A;        /* 藍色 / string */
    --ai-soft:#4E79A3;
    --gold:#E0A234;      /* 山吹 / current step */
    --coral:#E9795A;     /* warm accent, used sparingly */
    --shadow:0 10px 30px -12px rgba(47,45,40,.35);
    --r:20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Zen Kaku Gothic New",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.7;
    overflow-x:hidden;
  }
  /* faint woven texture */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
    background-image:
      linear-gradient(0deg, rgba(132,122,107,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(132,122,107,.045) 1px, transparent 1px);
    background-size:22px 22px;
  }
  .wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:0 20px 90px;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{display:block;max-width:100%;}

  /* ---------- Header ---------- */
  header{padding:26px 0 6px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  .brand .mark{width:40px;height:40px;flex:none;}
  .brand h1{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:900;
    font-size:clamp(20px,5vw,27px);margin:0;letter-spacing:.02em;white-space:nowrap;
  }
  .edit-btn{
    display:inline-flex;align-items:center;gap:7px;flex:none;
    padding:9px 15px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--paper);color:var(--muted);font-weight:700;font-size:13.5px;
    transition:.18s;
  }
  .edit-btn:hover{border-color:var(--ai);color:var(--ai);}
  .edit-btn.on{background:var(--gold);border-color:var(--gold);color:#3a2c08;}

  /* ---------- Hero (home) ---------- */
  .hero{padding:14px 0 4px;}
  .hero .thread{width:100%;height:74px;overflow:visible;}
  .hero .lead{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(26px,7vw,42px);line-height:1.25;margin:14px 0 6px;letter-spacing:.01em;
  }
  .hero .lead em{font-style:normal;color:var(--ai);}
  .hero p.sub{color:var(--muted);font-size:15.5px;margin:0 0 26px;max-width:34em;}

  .pick-label{
    display:flex;align-items:center;gap:10px;color:var(--muted);
    font-size:13px;font-weight:700;letter-spacing:.14em;margin:0 0 14px;
  }
  .pick-label::after{content:"";height:1px;background:var(--line);flex:1;}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .card{
    text-align:left;border-radius:var(--r);overflow:hidden;background:var(--paper);
    border:1.5px solid var(--line);box-shadow:var(--shadow);transition:.2s;position:relative;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--ai-soft);}
  .card .thumb{aspect-ratio:1/1;overflow:hidden;background:var(--paper-2);}
  .card .thumb img{width:100%;height:100%;object-fit:cover;transition:.4s;}
  .card:hover .thumb img{transform:scale(1.05);}
  .card .meta{padding:14px 16px 16px;}
  .card .name{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:22px;display:flex;align-items:center;gap:8px;}
  .card .count{color:var(--muted);font-size:13px;font-weight:500;margin-top:2px;}
  .card .go{
    margin-top:12px;display:inline-flex;align-items:center;gap:6px;
    color:var(--ai);font-weight:700;font-size:14px;
  }
  .card .badge{
    position:absolute;top:12px;left:12px;background:rgba(252,250,243,.92);
    backdrop-filter:blur(3px);border:1px solid var(--line);border-radius:999px;
    padding:4px 11px;font-size:12px;font-weight:700;color:var(--muted);
  }

  .note{
    margin-top:30px;padding:15px 18px;border-radius:16px;background:var(--paper-2);
    border:1px dashed #D9CFB8;color:var(--muted);font-size:13px;display:flex;gap:11px;align-items:flex-start;
  }
  .note b{color:var(--ink);}

  /* ---------- Viewer ---------- */
  .viewer{display:none;padding-top:8px;}
  .viewer.active{display:block;}
  .topbar{display:flex;align-items:center;gap:12px;margin:6px 0 16px;}
  .back{
    display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:999px;
    background:var(--paper);border:1.5px solid var(--line);font-weight:700;font-size:14px;transition:.18s;
  }
  .back:hover{border-color:var(--ai);color:var(--ai);}
  .vtitle{font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:22px;display:flex;align-items:center;gap:9px;}
  .vtitle .stepno{
    color:var(--muted);font-family:"Zen Kaku Gothic New";font-weight:700;font-size:15px;
    background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  }
  .vtitle[contenteditable="true"]{outline:2px dashed var(--gold);outline-offset:3px;border-radius:6px;padding:0 4px;}

  .stage{display:grid;grid-template-columns:64px 1fr;gap:18px;align-items:start;}

  /* bead rail = the string */
  .rail{position:relative;padding:6px 0;}
  .rail .line{position:absolute;left:50%;top:14px;bottom:14px;width:3px;transform:translateX(-50%);
    background:linear-gradient(var(--ai),var(--ai-soft));border-radius:3px;opacity:.28;}
  .rail .fill{position:absolute;left:50%;top:14px;width:3px;transform:translateX(-50%);
    background:linear-gradient(var(--ai),var(--ai-soft));border-radius:3px;transition:height .4s cubic-bezier(.4,0,.2,1);}
  .beads{position:relative;display:flex;flex-direction:column;gap:14px;align-items:center;}
  .bead{
    width:26px;height:26px;border-radius:50%;flex:none;border:2px solid var(--ai-soft);
    background:var(--paper);color:var(--ai);font-weight:700;font-size:12px;
    display:grid;place-items:center;transition:.22s;font-family:"Zen Kaku Gothic New";
  }
  .bead:hover{transform:scale(1.12);}
  .bead.done{background:var(--ai);border-color:var(--ai);color:#fff;}
  .bead.now{background:var(--gold);border-color:var(--gold);color:#3a2c08;transform:scale(1.28);
    box-shadow:0 0 0 4px rgba(224,162,52,.22);}

  .panel{min-width:0;}
  .photo-frame{
    position:relative;border-radius:var(--r);overflow:hidden;background:var(--paper-2);
    border:1.5px solid var(--line);box-shadow:var(--shadow);aspect-ratio:3/3.4;
  }
  .photo-frame img{width:100%;height:100%;object-fit:contain;background:#efe8d8;}
  .photo-frame .kbadge{
    position:absolute;top:12px;left:12px;background:var(--gold);color:#3a2c08;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:900;font-size:15px;
    border-radius:999px;padding:5px 15px;box-shadow:0 4px 12px -4px rgba(0,0,0,.3);
  }
  .photo-frame.fade img{animation:pop .38s ease;}
  @keyframes pop{from{opacity:0;transform:scale(1.02);}to{opacity:1;transform:scale(1);}}

  .caption{
    margin:16px 2px 0;font-size:clamp(16px,4.4vw,19px);font-weight:500;line-height:1.75;
    min-height:2.6em;
  }
  .caption[contenteditable="true"]{
    outline:2px dashed var(--gold);outline-offset:5px;border-radius:8px;padding:8px 10px;
    background:rgba(224,162,52,.06);
  }

  .nav{display:flex;gap:12px;margin-top:22px;}
  .nav button{
    flex:1;padding:16px;border-radius:16px;font-weight:700;font-size:16px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s;
    font-family:"Zen Maru Gothic",sans-serif;
  }
  .nav .prev{background:var(--paper);border:1.5px solid var(--line);color:var(--ink);}
  .nav .prev:hover:not(:disabled){border-color:var(--ai);color:var(--ai);}
  .nav .next{background:var(--ai);color:#fff;box-shadow:0 8px 20px -8px rgba(47,93,138,.6);}
  .nav .next:hover{background:#274f76;}
  .nav button:disabled{opacity:.4;cursor:default;}
  .nav .next.done{background:var(--coral);box-shadow:0 8px 20px -8px rgba(233,121,90,.6);}

  .allbtn{
    display:block;margin:16px auto 0;padding:11px 20px;border-radius:999px;
    background:var(--paper);border:1.5px solid var(--line);color:var(--muted);font-weight:700;font-size:14px;transition:.18s;
  }
  .allbtn:hover{border-color:var(--ai);color:var(--ai);}

  /* ---------- All-steps grid ---------- */
  .grid-view{display:none;padding-top:8px;}
  .grid-view.active{display:block;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:8px;}
  .cell{border-radius:16px;overflow:hidden;border:1.5px solid var(--line);background:var(--paper);text-align:left;transition:.18s;}
  .cell:hover{border-color:var(--ai-soft);transform:translateY(-3px);}
  .cell .ph{aspect-ratio:1/1;overflow:hidden;background:var(--paper-2);position:relative;}
  .cell .ph img{width:100%;height:100%;object-fit:cover;}
  .cell .n{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;
    background:var(--gold);color:#3a2c08;font-weight:800;font-size:13px;display:grid;place-items:center;
    font-family:"Zen Maru Gothic";}
  .cell .cap{padding:9px 11px 11px;font-size:12.5px;color:var(--muted);line-height:1.55;}

  /* ---------- Edit toolbar ---------- */
  .edit-bar{
    display:none;position:sticky;top:0;z-index:20;margin:0 -20px 14px;padding:11px 20px;
    background:rgba(224,162,52,.14);backdrop-filter:blur(8px);border-bottom:1px solid #E4C77E;
    align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#5f4a12;font-weight:600;
  }
  .edit-bar.show{display:flex;}
  .edit-bar .tools{margin-left:auto;display:flex;gap:8px;}
  .edit-bar .tbtn{padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;border:1.5px solid #D8AE4E;background:var(--paper);color:#5f4a12;transition:.15s;}
  .edit-bar .tbtn:hover{background:#fff;}
  .edit-bar .tbtn.primary{background:var(--ai);border-color:var(--ai);color:#fff;}

  footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px;text-align:center;line-height:1.8;}

  /* ---------- Responsive ---------- */
  @media(max-width:560px){
    .wrap{padding:0 15px 80px;}
    .cards{gap:12px;}
    .card .name{font-size:19px;}
    .stage{grid-template-columns:1fr;gap:12px;}
    .rail{order:2;}
    .rail .line,.rail .fill{top:50%;bottom:auto;left:0;right:0;width:auto;height:3px;transform:translateY(-50%);}
    .rail .fill{left:0;top:50%;height:3px!important;transition:width .4s cubic-bezier(.4,0,.2,1);}
    .beads{flex-direction:row;overflow-x:auto;gap:12px;padding:4px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .beads::-webkit-scrollbar{display:none;}
    .photo-frame{aspect-ratio:3/3.5;}
  }
  @media(prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- edit toolbar -->
  <div class="edit-bar" id="editBar">
    ✏️ 編集モード — 見出しやせつめいをタップして、あなたのことばで書きかえられます。
    <div class="tools">
      <button class="tbtn" id="btnReset">リセット</button>
      <button class="tbtn primary" id="btnCopy">手順をコピー</button>
    </div>
  </div>

  <header>
    <div class="brand">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M6 22 C6 12 14 8 20 12 C26 8 34 12 34 22 C34 30 27 34 20 30 C13 34 6 30 6 22 Z"
              fill="none" stroke="#2F5D8A" stroke-width="2.6" stroke-linecap="round"/>
        <circle cx="20" cy="21" r="4.2" fill="#E0A234"/>
      </svg>
      <h1>あやとり てほん</h1>
    </div>
    <button class="edit-btn" id="editToggle" aria-pressed="false">✏️ <span>編集</span></button>
  </header>

  <!-- ============ HOME ============ -->
  <section class="home" id="home">
    <div class="hero">
      <svg class="thread" viewBox="0 0 800 74" preserveAspectRatio="none" aria-hidden="true">
        <path id="threadPath" d="M0 40 C 120 -6, 200 76, 320 40 S 520 4, 640 40 S 760 70, 800 34"
              fill="none" stroke="#2F5D8A" stroke-width="3" stroke-linecap="round" opacity=".85"/>
        <circle cx="320" cy="40" r="5.5" fill="#E0A234"/>
        <circle cx="640" cy="40" r="5.5" fill="#E9795A"/>
      </svg>
      <div class="lead">一本の糸から、<br><em>かたち</em>が生まれる。</div>
      <p class="sub">写真とことばで、あやとりの手順をひとつずつ。すきな作品をえらんで、じぶんのペースで進めましょう。</p>
    </div>

    <div class="pick-label">つくるものをえらぶ</div>
    <div class="cards" id="cards"><!-- filled by JS --></div>

    <div class="note">
      <span style="font-size:18px;line-height:1;">🧵</span>
      <div><b>写真について：</b>掲載している手の写真はすべて手づくりのオリジナルです。あやとりの技じたいは昔から伝わる遊びなので、だれでも自由に楽しめます。せつめい文は「編集」から自由に書きかえてください。</div>
    </div>
  </section>

  <!-- ============ VIEWER ============ -->
  <section class="viewer" id="viewer">
    <div class="topbar">
      <button class="back" data-home>‹ もどる</button>
      <div class="vtitle"><span id="vTitle"></span><span class="stepno" id="vStep"></span></div>
    </div>
    <div class="stage">
      <div class="rail">
        <div class="line"></div><div class="fill" id="railFill"></div>
        <div class="beads" id="beads"></div>
      </div>
      <div class="panel">
        <div class="photo-frame" id="frame">
          <span class="kbadge" id="kbadge"></span>
          <img id="photo" alt="">
        </div>
        <p class="caption" id="caption"></p>
        <div class="nav">
          <button class="prev" id="prev">‹ まえ</button>
          <button class="next" id="next">つぎ ›</button>
        </div>
        <button class="allbtn" data-all>ぜんぶの手順を見る ▦</button>
      </div>
    </div>
  </section>

  <!-- ============ GRID ============ -->
  <section class="grid-view" id="gridView">
    <div class="topbar">
      <button class="back" data-viewer>‹ 手順にもどる</button>
      <div class="vtitle"><span id="gTitle"></span></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    あやとり てほん — 写真でおぼえる糸あそび<br>
    手の写真・せつめいはオリジナル。伝承あそびをみんなで楽しもう。
  </footer>
</div>

<script>
/* ============================================================
   ここを書きかえると、手順のせつめいがかわります。
   ・title …… さくひんの名前
   ・steps[n].text …… その写真のせつめい
   （画面の「編集」ボタンからでも、直接書きかえられます）
   ============================================================ */
const USAGI_STEPS = 13, NAKA_STEPS = 15;

function mkSteps(prefix, count, texts){
  const a=[];
  for(let i=1;i<=count;i++){
    a.push({ img:`images/${prefix}_${String(i).padStart(2,'0')}.jpg`, text:texts[i-1]||"" });
  }
  return a;
}

// 写真の内容がいちばんの手本です。文は「写真と手をあわせる」ためのヒント。
const mid = [
  "写真とおなじ手の形になるように、指を動かしてみましょう。",
  "指にかかった糸を、そっとおとなりの指へかけかえます。あわてなくて大丈夫。",
  "糸がゆるまないように、両手をひろげてピンとはります。",
  "反対の手の指で、まん中の糸をすくいとります。",
  "したの糸をとって、うえの糸をこえるようにかけます。",
  "小指にかかった糸を、はずしてまえに落とします。",
  "おや指で、むこうがわの糸をひっかけて手前に返します。",
  "形がくずれたら、ひとつ前の写真にもどってやり直そう。",
  "左右がおなじ形になっているか、たしかめながら進めます。",
  "糸をきゅっと引いて、かたちをととのえます。",
  "指をゆっくりぬいて、あみめをそろえます。",
  "もうすこし。写真をよく見て、指のばしょをあわせよう。",
  "手をひらいて、かたちが出てくるのを待ちます。",
];
function fill(count, name, emoji){
  const t=[];
  t.push("糸を輪にして両手にかけ、スタートの形をつくります。");
  for(let i=1;i<count-1;i++) t.push(mid[(i-1)%mid.length]);
  t.push(`できあがり！「${name}」のかんせいです。${emoji}`);
  return t;
}

const DEFAULTS = {
  usagi:{ title:"うさぎ", emoji:"🐰", cover:"images/usagi_13.jpg",
          steps:mkSteps("usagi",USAGI_STEPS, fill(USAGI_STEPS,"うさぎ","🐰")) },
  naka: { title:"なか",  emoji:"✨", cover:"images/naka_15.jpg",
          steps:mkSteps("naka",NAKA_STEPS, fill(NAKA_STEPS,"なか","✨")) },
};

/* ---------- overrides (saved edits) ---------- */
const LS="ayatori-overrides-v1";
let overrides={};
try{ overrides=JSON.parse(localStorage.getItem(LS))||{}; }catch(e){ overrides={}; }

function figure(key){
  const d=DEFAULTS[key];
  const o=overrides[key]||{};
  const steps=d.steps.map((s,i)=>({
    img:s.img,
    text:(o.steps&&o.steps[i]!=null)?o.steps[i]:s.text
  }));
  return { key, title:o.title||d.title, emoji:d.emoji, cover:d.cover, steps };
}
function saveText(key,idx,val){
  overrides[key]=overrides[key]||{};
  overrides[key].steps=overrides[key].steps||[];
  overrides[key].steps[idx]=val;
  localStorage.setItem(LS,JSON.stringify(overrides));
}
function saveTitle(key,val){
  overrides[key]=overrides[key]||{};
  overrides[key].title=val;
  localStorage.setItem(LS,JSON.stringify(overrides));
}

/* ---------- state ---------- */
let cur=null, idx=0, editing=false;
const $=s=>document.querySelector(s);

/* ---------- home ---------- */
function buildHome(){
  const cards=$("#cards"); cards.innerHTML="";
  ["usagi","naka"].forEach(k=>{
    const f=figure(k);
    const b=document.createElement("button");
    b.className="card";
    b.innerHTML=`
      <span class="badge">${f.steps.length}ステップ</span>
      <div class="thumb"><img src="${f.cover}" alt="${f.title} かんせい図" loading="lazy"></div>
      <div class="meta">
        <div class="name">${f.emoji} ${f.title}</div>
        <div class="count">写真を見ながら、ひとつずつ</div>
        <div class="go">はじめる ›</div>
      </div>`;
    b.onclick=()=>openFigure(k);
    cards.appendChild(b);
  });
}

/* ---------- viewer ---------- */
function openFigure(k){
  cur=figure(k); idx=0;
  show("viewer");
  buildBeads();
  render();
}
function buildBeads(){
  const beads=$("#beads"); beads.innerHTML="";
  cur.steps.forEach((_,i)=>{
    const b=document.createElement("button");
    b.className="bead"; b.textContent=i+1;
    b.setAttribute("aria-label",`ステップ${i+1}へ`);
    b.onclick=()=>{ idx=i; render(); };
    beads.appendChild(b);
  });
}
function render(){
  const f=cur, n=f.steps.length, s=f.steps[idx];
  $("#vTitle").textContent=`${f.emoji} ${f.title}`;
  $("#vStep").textContent=`${idx+1} / ${n}`;
  const frame=$("#frame"); frame.classList.remove("fade"); void frame.offsetWidth; frame.classList.add("fade");
  const img=$("#photo");
  img.src=s.img; img.alt=`${f.title} ステップ${idx+1}`;
  $("#kbadge").textContent=idx+1;
  const cap=$("#caption"); cap.textContent=s.text;
  cap.contentEditable=editing?"true":"false";

  // beads state
  document.querySelectorAll(".bead").forEach((b,i)=>{
    b.classList.toggle("done",i<idx);
    b.classList.toggle("now",i===idx);
  });
  // rail fill
  const pct = n>1 ? (idx/(n-1))*100 : 0;
  const fillEl=$("#railFill");
  if(window.matchMedia("(max-width:560px)").matches){ fillEl.style.width=pct+"%"; fillEl.style.height="3px"; }
  else { fillEl.style.height=pct+"%"; fillEl.style.width="3px"; }

  // nav
  $("#prev").disabled = idx===0;
  const next=$("#next"), last=idx===n-1;
  next.textContent = last ? "できた！ ✓" : "つぎ ›";
  next.classList.toggle("done",last);

  // keep current bead in view on mobile
  const nowBead=document.querySelector(".bead.now");
  if(nowBead) nowBead.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
}
function go(d){
  const n=cur.steps.length;
  if(idx===n-1 && d>0){ flash(`「${cur.title}」かんせい！おつかれさま 🎉`); show("home"); return; }
  idx=Math.min(n-1,Math.max(0,idx+d)); render();
}

/* ---------- grid ---------- */
function openGrid(){
  const f=cur; show("gridView");
  $("#gTitle").textContent=`${f.emoji} ${f.title} — ぜんぶの手順`;
  const g=$("#grid"); g.innerHTML="";
  f.steps.forEach((s,i)=>{
    const c=document.createElement("button");
    c.className="cell";
    c.innerHTML=`<div class="ph"><span class="n">${i+1}</span><img src="${s.img}" alt="${f.title} ステップ${i+1}" loading="lazy"></div><div class="cap">${s.text||""}</div>`;
    c.onclick=()=>{ idx=i; show("viewer"); render(); };
    g.appendChild(c);
  });
}

/* ---------- view switch ---------- */
function show(which){
  $("#home").style.display = which==="home"?"block":"none";
  $("#viewer").classList.toggle("active",which==="viewer");
  $("#gridView").classList.toggle("active",which==="gridView");
  window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});
}

/* ---------- edit mode ---------- */
function setEdit(on){
  editing=on;
  $("#editToggle").classList.toggle("on",on);
  $("#editToggle").setAttribute("aria-pressed",on);
  $("#editToggle").querySelector("span").textContent = on?"編集中":"編集";
  $("#editBar").classList.toggle("show",on);
  const vt=$("#vTitle");
  const vtile=document.querySelector(".vtitle");
  if(cur){
    $("#caption").contentEditable=on?"true":"false";
  }
  // title editable
  if(vt){
    vt.contentEditable=on?"true":"false";
    vtile.setAttribute("contenteditable",on?"true":"false");
  }
}
document.addEventListener("blur",e=>{
  if(!editing||!cur) return;
  if(e.target.id==="caption"){
    const val=e.target.textContent.trim();
    cur.steps[idx].text=val; saveText(cur.key,idx,val);
    buildHome();
  }
  if(e.target.id==="vTitle"){
    const val=e.target.textContent.replace(cur.emoji,"").trim();
    if(val){ cur.title=val; saveTitle(cur.key,val); buildHome(); }
  }
},true);

function copySteps(){
  const out={};
  ["usagi","naka"].forEach(k=>{
    const f=figure(k);
    out[k]={ title:f.title, steps:f.steps.map(s=>s.text) };
  });
  const txt=JSON.stringify(out,null,2);
  navigator.clipboard.writeText(txt).then(
    ()=>flash("コピーしました！コードのDEFAULTSに貼りつけると、ずっと保存できます。"),
    ()=>{ prompt("下の内容をコピーしてください：",txt); }
  );
}
function resetAll(){
  if(!confirm("編集した内容をすべて元にもどしますか？")) return;
  overrides={}; localStorage.removeItem(LS);
  buildHome();
  if(cur){ cur=figure(cur.key); buildBeads(); render(); }
  flash("元にもどしました。");
}
let flashT;
function flash(msg){
  let el=document.getElementById("flash");
  if(!el){ el=document.createElement("div"); el.id="flash";
    el.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#28241F;color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:99;box-shadow:0 10px 30px -8px rgba(0,0,0,.4);max-width:90vw;text-align:center;transition:.3s;opacity:0;";
    document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity="1";
  clearTimeout(flashT); flashT=setTimeout(()=>el.style.opacity="0",3200);
}

/* ---------- events ---------- */
$("#prev").onclick=()=>go(-1);
$("#next").onclick=()=>go(1);
document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>show("home"));
document.querySelectorAll("[data-viewer]").forEach(b=>b.onclick=()=>show("viewer"));
document.querySelectorAll("[data-all]").forEach(b=>b.onclick=openGrid);
$("#editToggle").onclick=()=>setEdit(!editing);
$("#btnCopy").onclick=copySteps;
$("#btnReset").onclick=resetAll;

// keyboard
document.addEventListener("keydown",e=>{
  if(editing) return;
  if(!$("#viewer").classList.contains("active")) return;
  if(e.key==="ArrowRight") go(1);
  if(e.key==="ArrowLeft") go(-1);
});
// swipe
let sx=null;
$("#frame").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; },{passive:true});
$("#frame").addEventListener("touchend",e=>{
  if(sx===null||editing) return;
  const dx=e.changedTouches[0].clientX-sx;
  if(Math.abs(dx)>50) go(dx<0?1:-1);
  sx=null;
},{passive:true});

// animate hero thread on load
window.addEventListener("load",()=>{
  const p=$("#threadPath");
  if(p && typeof p.getTotalLength==="function" && !window.matchMedia("(prefers-reduced-motion:reduce)").matches){
    const len=p.getTotalLength();
    p.style.strokeDasharray=len; p.style.strokeDashoffset=len;
    p.getBoundingClientRect();
    p.style.transition="stroke-dashoffset 1.1s ease .15s";
    p.style.strokeDashoffset="0";
  }
});

buildHome();
</script>
</body>
</html>
